[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/", "@uniswap/v4-core/=lib/v4-core/", "forge-std/=lib/forge-std/src/"]

[lint]
lint_on_build = false
